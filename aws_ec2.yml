plugin: amazon.aws.aws_ec2  # Should be the fully qualified plugin name here
regions:
  - us-east-1
filters:
  instance-state-name: running
  tag:Name: ubuntu
hostnames:
  - public-ip-address
compose:
  ansible_host: public_ip_address
  ansible_user: ubuntu
  ansible_python_interpreter: /usr/bin/python3
keyed_groups:
  - key: tags.Name
    prefix: tag

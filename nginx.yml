---
- name: Install and configure Nginx
  hosts: aws_ec2
  become: yes  # Elevate privileges to root

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"  # Only for Debian-based systems (Ubuntu, etc.)
    
    - name: Install Nginx (RedHat/CentOS)
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"  # Only for RedHat-based systems (RHEL, CentOS)

    - name: Start Nginx service
      service:
        name: nginx
        state: started
        enabled: yes  # Ensure nginx starts on boot
